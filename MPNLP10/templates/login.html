<!DOCTYPE html>
<html>
<head>
  <title>Login | Text Summarizer</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background: rgb(16, 223, 85); font-family: sans-serif;">

<div class="container" style="margin-top: 100px; max-width: 400px;">
  <h2 class="text-center mb-4">Login to Text Summarizer</h2>

  <form method="POST" action="{{ url_for('login') }}" class="border p-4 shadow-sm rounded">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" class="form-control" placeholder="Username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" class="form-control" placeholder="Password" required>
    </div>
    <button type="submit" class="btn btn-success btn-block">Login</button>
  </form>

  {% if error %}
    <div class="alert alert-danger mt-3">
      {{ error }}
    </div>
  {% endif %}
</div>

</body>
</html>
