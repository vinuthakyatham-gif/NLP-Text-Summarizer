<!DOCTYPE html>
<html>
<head>
  <title>Text Summarizer</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" type="text/css" href="static/style.css">

</head>
<body style="background: rgb(16, 223, 85); font-family: 'Open Sans', sans-serif;">

<nav class="navbar navbar-expand-sm bg-dark fixed-top">
  <a class="navbar-brand text-white" href="#"><b>Text Summarizer</b></a>
  <ul class="navbar-nav ml-auto">
    <li class="nav-item"><a class="nav-link text-white" href="/home"><i class="fa fa-home"></i> Home</a></li>
    <li class="nav-item"><a class="nav-link text-white" href="/logout"><i class="fa fa-sign-out"></i> Logout</a></li>
  </ul>
</nav>

<div class="container" style="margin-top: 100px;">
  <form method="POST" class="jumbotron">
    <h3>Enter Text to Summarize</h3>
    <textarea name="input_text" rows="8" cols="80" class="form-control" required>{{ request.form.get('input_text', '') }}</textarea>
    <br>
    <label>Number of Sentences in Summary</label>
    <input type="number" name="num_sentences" min="1" max="100" class="form-control" required>
    <br>
    <input type="submit" value="Summarize" class="btn btn-success">
  </form>

  {% if output_summary %}
    <div class="card p-4 mb-4">
      <h4>Summarized Text:</h4>
      <ul>
        {% for sentence in output_summary %}
          <li>{{ sentence }}</li>
        {% endfor %}
      </ul>
    </div>

    <div class="card p-4">
      <h4>Original Text:</h4>
      <p>{{ original_text }}</p>
    </div>
  {% endif %}
</div>

</body>
</html>
